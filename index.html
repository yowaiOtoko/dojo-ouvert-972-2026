<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opération Dojos Ouverts 2026 - Martinique Judo</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales-all.global.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --text: #e8e8ea;
    --muted: #9aa0aa;
    --accent: #4a90d9;
    --border: #2a2d35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 20px 12px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    font-weight: 700;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  #ics-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    background: var(--accent);
    border: none;
    color: white;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
  }
  #ics-cta:hover { background: #3f7fc2; }
  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    justify-content: center;
    padding: 14px 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #calendar-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }
  #calendar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .fc {
    --fc-border-color: var(--border);
    --fc-page-bg-color: var(--panel);
    --fc-neutral-bg-color: #22252d;
    --fc-list-event-hover-bg-color: #22252d;
    --fc-today-bg-color: rgba(74, 144, 217, 0.12);
  }
  .fc .fc-toolbar-title { color: var(--text); font-size: 1.2rem; }
  .fc .fc-button {
    background: #22252d;
    border: 1px solid var(--border);
    color: var(--text);
    text-transform: capitalize;
    box-shadow: none;
  }
  .fc .fc-button:hover { background: #2a2d38; }
  .fc .fc-button-primary:not(:disabled).fc-button-active,
  .fc .fc-button-primary:not(:disabled):active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .fc-daygrid-day-number, .fc-col-header-cell-cushion { color: var(--text); }
  .fc-daygrid-day.fc-day-other .fc-daygrid-day-number { color: var(--muted); }
  .fc-event { cursor: pointer; border: none !important; padding: 1px 4px; font-size: 0.8rem; }
  .fc-list-event-dot { border-color: inherit !important; }
  .fc-list-day-cushion { background: #22252d !important; color: var(--text); }
  .fc-list-event:hover td { background: #22252d !important; }
  .fc-list-event-title { color: var(--text) !important; }
  .fc-list-event-time { color: var(--muted) !important; }

  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 420px;
    width: 100%;
    padding: 22px;
  }
  #modal h2 { margin: 0 0 10px; font-size: 1.15rem; }
  #modal .row { margin: 8px 0; font-size: 0.92rem; color: var(--muted); }
  #modal .row strong { color: var(--text); }
  #modal button {
    margin-top: 16px;
    background: var(--accent);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 10px 20px 30px;
  }

  @media (max-width: 640px) {
    header { padding: 18px 12px 8px; }
    header h1 { font-size: 1.25rem; }
    header p { font-size: 0.85rem; }
    #legend { padding: 10px 12px; gap: 6px 12px; }
    .legend-item { font-size: 0.75rem; }
    #calendar-wrap { padding: 0 8px 24px; }
    #calendar { padding: 8px; border-radius: 8px; }
    .fc .fc-toolbar { flex-direction: column; gap: 10px; }
    .fc .fc-toolbar-chunk { display: flex; justify-content: center; }
    .fc .fc-toolbar-title { font-size: 1rem; }
    .fc .fc-button { padding: 4px 8px; font-size: 0.78rem; }
    .fc-daygrid-day-number { font-size: 0.78rem; }
    .fc-event { font-size: 0.7rem; }
    .fc .fc-col-header-cell-cushion { font-size: 0.72rem; }
    #modal { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Opération Dojos Ouverts 2026</h1>
  <p>Ligue de Judo de la Martinique — calendrier public, lecture seule</p>
  <br>
  <a id="ics-cta" href="#" download="dojos-ouverts-2026.ics">📅 Télécharger le calendrier (.ics)</a>
</header>

<div id="legend"></div>

<div id="calendar-wrap">
  <div id="calendar"></div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="m-title"></h2>
    <div class="row" id="m-time"></div>
    <div class="row" id="m-location"></div>
    <div class="row" id="m-desc"></div>
    <div class="row" id="m-contact"></div>
    <button onclick="closeModal()">Fermer</button>
  </div>
</div>

<footer>Ligue de Judo de la Martinique — IMS, Quartier Mangot Vulcin, 97232 Lamentin</footer>

<script>
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

function icsEscape(str) {
  return String(str).replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\n/g, '\\n');
}
function icsDateUTC(d) {
  return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
}
function icsDateOnly(dateStr) {
  return dateStr.replace(/-/g, '');
}
function buildICS(events) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ligue de Judo de la Martinique//Dojos Ouverts 2026//FR', 'CALSCALE:GREGORIAN'];
  events.forEach((e, i) => {
    lines.push('BEGIN:VEVENT');
    lines.push('UID:dojos-ouverts-2026-' + i + '@judo-martinique');
    lines.push('SUMMARY:' + icsEscape(e.title));
    if (e.allDay) {
      lines.push('DTSTART;VALUE=DATE:' + icsDateOnly(e.start));
      if (e.end) lines.push('DTEND;VALUE=DATE:' + icsDateOnly(e.end));
    } else {
      lines.push('DTSTART:' + icsDateUTC(new Date(e.start)));
      if (e.end) lines.push('DTEND:' + icsDateUTC(new Date(e.end)));
    }
    if (e.location) lines.push('LOCATION:' + icsEscape(e.location));
    const descParts = [];
    if (e.description) descParts.push(e.description);
    if (e.contact) descParts.push('Contact : ' + e.contact);
    if (descParts.length) lines.push('DESCRIPTION:' + icsEscape(descParts.join('\n')));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

fetch('events.json')
  .then(r => r.json())
  .then(events => {
    const icsContent = buildICS(events);
    const icsBlob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    document.getElementById('ics-cta').href = URL.createObjectURL(icsBlob);

    // legend
    const seen = new Map();
    events.forEach(e => {
      const club = e.title.split(' - ')[0].split(' (')[0];
      if (!seen.has(club)) seen.set(club, e.color);
    });
    const legendEl = document.getElementById('legend');
    seen.forEach((color, club) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${club}`;
      legendEl.appendChild(item);
    });

    const calendarEl = document.getElementById('calendar');
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    const calendar = new FullCalendar.Calendar(calendarEl, {
      locale: 'fr',
      initialView: isMobile ? 'listMonth' : 'dayGridMonth',
      initialDate: '2026-07-15',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,listMonth'
      },
      buttonText: { today: "aujourd'hui", month: 'mois', week: 'semaine', list: 'liste' },
      height: 'auto',
      events: events,
      eventClick: function(info) {
        const e = info.event;
        document.getElementById('m-title').textContent = e.title;
        const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const timeOpts = { hour: '2-digit', minute: '2-digit' };
        let timeStr;
        if (e.allDay) {
          const endDisplay = new Date(e.end || e.start);
          endDisplay.setDate(endDisplay.getDate() - 1);
          timeStr = e.start.toLocaleDateString('fr-FR', opts) +
            (e.end ? ' → ' + endDisplay.toLocaleDateString('fr-FR', opts) : '');
        } else {
          timeStr = e.start.toLocaleDateString('fr-FR', opts) + ' · ' +
            e.start.toLocaleTimeString('fr-FR', timeOpts) + ' - ' +
            (e.end ? e.end.toLocaleTimeString('fr-FR', timeOpts) : '');
        }
        document.getElementById('m-time').innerHTML = '<strong>Quand : </strong>' + timeStr;
        const loc = e.extendedProps.location;
        document.getElementById('m-location').innerHTML = loc ? '<strong>Où : </strong>' + loc : '';
        const desc = e.extendedProps.description;
        document.getElementById('m-desc').innerHTML = desc ? desc : '';
        const contact = e.extendedProps.contact;
        document.getElementById('m-contact').innerHTML = contact ? '<strong>Contact : </strong>' + contact : '';
        document.getElementById('modal-overlay').classList.add('open');
      }
    });
    calendar.render();
  });
</script>

</body>
</html>
